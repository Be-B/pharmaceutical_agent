[project]
name = "pharmaceutical-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "sse-starlette~=2.1",
    "pydantic-settings~=2.5",
    "sqlalchemy~=2.0",
    "bcrypt~=4.2",
    "python-jose[cryptography]~=3.3",
    "python-multipart~=0.0",
    "langchain~=0.3",
    "langchain-openai~=0.2",
    "langchain-community~=0.3",
    "langgraph~=0.2",
    "faiss-cpu~=1.9",
    "cohere>=5.11",
    "pyyaml~=6.0",
    "alembic~=1.13",
]

[dependency-groups]
dev = ["pytest~=8.3", "httpx~=0.27", "pytest-asyncio~=0.24"]

[tool.uv]
package = false
