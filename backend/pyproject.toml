[project]
name = "pharmaceutical-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "sse-starlette~=2.1",
    "pydantic-settings~=2.5",
    "sqlalchemy~=2.0",
    "bcrypt~=4.2",
    "python-jose[cryptography]~=3.3",
    "python-multipart~=0.0",
    "langchain~=0.3",
    "langchain-openai~=0.2",
    "langchain-community~=0.3",
    "langgraph~=0.2",
    "langfuse~=2.0",
    "faiss-cpu~=1.9",
    "cohere>=5.11",
    "pyyaml~=6.0",
    "alembic~=1.13",
    "httpx~=0.27",
]

[dependency-groups]
dev = ["pytest~=8.3", "httpx~=0.27", "pytest-asyncio~=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not network'"
markers = [
    "network: 실제 supp.ai API를 호출하는 테스트 (기본 비활성, '-m network'로 실행)",
]
